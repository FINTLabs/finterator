plugins {
	id 'org.springframework.boot' version '2.7.16'
	id 'io.spring.dependency-management' version '1.1.3'
	id 'java'
}

group = 'no.fintlabs'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	repositories {
		maven {
			url "https://repo.fintlabs.no/releases"
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	implementation 'no.fintlabs:flais-operator-starter:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.testng:testng:7.1.0'
    testImplementation 'junit:junit:4.13.1'
    annotationProcessor 'io.fabric8:crd-generator-apt:6.2.0'

	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'no.fintlabs:fint-kafka:4.0.1'

	compileOnly 'org.projectlombok:lombok'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'cglib:cglib-nodep:3.3.0'
	testImplementation 'org.spockframework:spock-spring:2.4-M1-groovy-4.0'
	testImplementation 'org.spockframework:spock-core:2.4-M1-groovy-4.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('copyResourceDefinition', Copy) {
	from "$buildDir/classes/java/main/META-INF/fabric8/fintclients.fintlabs.no-v1.yml","$buildDir/classes/java/main/META-INF/fabric8/fintadapters.fintlabs.no-v1.yml"
	into "$projectDir/kustomize/base"
}

tasks.named("build") { finalizedBy("copyResourceDefinition") }

tasks.named("clean") {
	doLast {
		project.delete("$projectDir/kustomize/base/fintclients.fintlabs.no-v1.yml")
	}
}
